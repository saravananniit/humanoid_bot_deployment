<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humanoid · talk face to face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #07090c;
    --panel: #10141a;
    --line: #232b35;
    --porcelain: #e9edf0;
    --steel: #8a97a3;
    --ice: #a8d8ee;
    --alert: #f0a8a8;
    --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--porcelain);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 24px;
  }

  /* ---------- top bar ---------- */
  .bar {
    width: 100%; max-width: 960px;
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 12px;
  }
  .bar h1 { font-size: 15px; font-weight: 500; margin: 0; letter-spacing: .01em; color: var(--steel); }
  .gear {
    background: none; border: 1px solid var(--line); color: var(--porcelain);
    font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .gear:hover { border-color: var(--steel); }

  .settings {
    width: 100%; max-width: 960px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 14px;
    display: none; gap: 12px; grid-template-columns: 2fr 1.4fr 1.4fr;
  }
  .settings.open { display: grid; }
  .settings label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--steel); }
  .settings input {
    background: var(--ink); color: var(--porcelain); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; font: inherit; font-size: 14px;
  }
  .settings input:focus { outline: 2px solid var(--ice); outline-offset: 1px; }
  .settings .note { grid-column: 1 / -1; font-size: 12px; color: var(--steel); margin: 0; }

  /* ---------- the face ---------- */
  .stage {
    position: relative;
    width: 100%; max-width: 960px;
    aspect-ratio: 16 / 9;
    max-height: 62vh;
    display: flex; justify-content: center;
  }
  .face {
    position: relative; height: 100%; aspect-ratio: 16 / 9; max-width: 100%;
    /* dissolve the frame edges into the page so the face emerges from the dark */
    -webkit-mask-image: radial-gradient(ellipse 62% 78% at 50% 46%, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 62% 78% at 50% 46%, #000 62%, transparent 100%);
    transition: filter .5s ease, transform .6s ease;
    filter: brightness(.62) saturate(.85);
  }
  .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #gif { opacity: 0; transition: opacity .25s ease; }

  .stage[data-state="listening"] .face { filter: brightness(.95); }
  .stage[data-state="thinking"]  .face { filter: brightness(.7) saturate(.7); animation: breathe 1.6s ease-in-out infinite; }
  .stage[data-state="speaking"]  .face { filter: brightness(1.05); transform: scale(1.015); }
  .stage[data-state="speaking"] #gif { opacity: 1; }

  .halo {
    position: absolute; left: 50%; top: 47%; width: 46%; aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 50%;
    border: 1px solid var(--ice); opacity: 0; pointer-events: none;
  }
  .stage[data-state="listening"] .halo { animation: ring 1.8s ease-out infinite; }

  @keyframes ring { from { opacity: .55; transform: translate(-50%,-50%) scale(.78); }
                    to   { opacity: 0;   transform: translate(-50%,-50%) scale(1.12); } }
  @keyframes breathe { 50% { filter: brightness(.55) saturate(.6); } }
  @media (prefers-reduced-motion: reduce) {
    .stage .face, .halo { animation: none !important; }
  }

  /* ---------- captions + controls ---------- */
  .status { margin: 10px 0 0; font-size: 13px; color: var(--steel); min-height: 18px; text-align: center; }
  .status.error { color: var(--alert); }
  .caption {
    width: 100%; max-width: 640px; min-height: 76px; margin: 6px 0 14px;
    text-align: center; font-size: 19px; line-height: 1.45; font-weight: 400;
  }
  .caption .you { display: block; color: var(--steel); font-size: 14px; margin-bottom: 6px; }

  .ask { width: 100%; max-width: 640px; display: flex; gap: 10px; align-items: center; }
  .ask input {
    flex: 1; background: var(--panel); color: var(--porcelain);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 14px 20px; font: inherit; font-size: 16px;
  }
  .ask input::placeholder { color: var(--steel); }
  .ask input:focus { outline: 2px solid var(--ice); outline-offset: 1px; }
  .btn {
    flex: none; width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel); color: var(--porcelain);
    display: grid; place-items: center; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--steel); }
  .btn:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn svg { width: 20px; height: 20px; }
  #mic.rec { background: var(--ice); color: var(--ink); border-color: var(--ice); }

  @media (max-width: 640px) {
    .settings { grid-template-columns: 1fr; }
    .caption { font-size: 17px; }
  }
</style>
</head>
<body>

<header class="bar">
  <h1>Humanoid</h1>
  <button class="gear" id="gear" aria-expanded="false" aria-controls="settings">Connection settings</button>
</header>

<section class="settings" id="settings">
  <label>Groq API key
    <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off">
  </label>
  <label>Chat model
    <input id="model" value="openai/gpt-oss-20b" autocomplete="off">
  </label>
  <label>Speech-to-text model
    <input id="sttModel" value="whisper-large-v3-turbo" autocomplete="off">
  </label>
  <p class="note">The key stays in this page and is sent with each request to your own FastAPI server. It is never saved.</p>
</section>

<main class="stage" id="stage" data-state="idle">
  <div class="face">
    <img id="still" src="/static/Humanoid.png" alt="Humanoid assistant face">
    <img id="gif" src="/static/Humanoid.png" alt="">
  </div>
  <div class="halo"></div>
</main>

<p class="status" id="status" role="status">Ask me a question. I only wake up when you do.</p>
<div class="caption" id="caption" aria-live="polite"></div>

<form class="ask" id="form">
  <button type="button" class="btn" id="mic" aria-label="Record a question">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <input id="text" type="text" placeholder="Type a question, or tap the mic" autocomplete="off">
  <button type="submit" class="btn" id="send" aria-label="Send question">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
  </button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const stage = $("stage"), statusEl = $("status"), caption = $("caption");
const gif = $("gif"), mic = $("mic"), send = $("send"), textIn = $("text");
const GIF_SRC = "/static/Humanoid.gif", STILL_SRC = "/static/Humanoid.png";

let history = [];
let recorder = null, chunks = [], busy = false;

/* ---------- state: idle | listening | thinking | speaking ---------- */
function setState(s, msg, isError = false) {
  stage.dataset.state = s;
  if (s === "speaking") gif.src = GIF_SRC + "?t=" + Date.now();   // restart loop from frame 0
  else gif.src = STILL_SRC;                                        // stop the animation
  if (msg !== undefined) { statusEl.textContent = msg; statusEl.classList.toggle("error", isError); }
}

$("gear").onclick = () => {
  const open = $("settings").classList.toggle("open");
  $("gear").setAttribute("aria-expanded", open);
};

function creds() {
  const api_key = $("apiKey").value.trim();
  if (!api_key) {
    $("settings").classList.add("open");
    setState("idle", "Add your Groq API key in connection settings first.", true);
    $("apiKey").focus();
    return null;
  }
  return { api_key, model: $("model").value.trim(), stt_model: $("sttModel").value.trim() };
}

/* ---------- talk to FastAPI ---------- */
async function ask({ text, audioBlob }) {
  const c = creds(); if (!c || busy) return;
  busy = true; send.disabled = true;
  stopSpeech();
  setState("thinking", "Thinking…");

  const fd = new FormData();
  fd.append("api_key", c.api_key);
  fd.append("model", c.model);
  fd.append("stt_model", c.stt_model);
  fd.append("history", JSON.stringify(history));
  if (text) fd.append("text", text);
  if (audioBlob) fd.append("audio", audioBlob, audioBlob.type.includes("mp4") ? "q.mp4" : "q.webm");

  try {
    const r = await fetch("/api/chat", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Request failed");

    history.push({ role: "user", content: data.transcript }, { role: "assistant", content: data.reply });
    caption.innerHTML = "";
    const you = document.createElement("span"); you.className = "you"; you.textContent = data.transcript;
    caption.append(you, document.createTextNode(data.reply));
    speak(data.reply);
  } catch (e) {
    setState("idle", e.message, true);
  } finally {
    busy = false; send.disabled = false;
  }
}

/* ---------- voice out (browser speech synthesis) ---------- */
function stopSpeech() { speechSynthesis.cancel(); }
function speak(reply) {
  const u = new SpeechSynthesisUtterance(reply);
  const v = speechSynthesis.getVoices().find(v => /en[-_](US|GB|IN)/i.test(v.lang));
  if (v) u.voice = v;
  u.rate = 1;
  u.onstart = () => setState("speaking", "Speaking…");
  u.onend = u.onerror = () => setState("idle", "Ask another question whenever you like.");
  speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged = () => {};

/* ---------- voice in (MediaRecorder) ---------- */
mic.onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  if (!creds() || busy) return;
  stopSpeech();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/mp4";
    recorder = new MediaRecorder(stream, { mimeType: mime });
    chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      mic.classList.remove("rec");
      mic.setAttribute("aria-label", "Record a question");
      ask({ audioBlob: new Blob(chunks, { type: mime }) });
    };
    recorder.start();
    mic.classList.add("rec");
    mic.setAttribute("aria-label", "Stop recording");
    setState("listening", "Listening… tap the mic again when you finish.");
  } catch {
    setState("idle", "Microphone blocked. Allow mic access, or type your question.", true);
  }
};

$("form").onsubmit = (e) => {
  e.preventDefault();
  const t = textIn.value.trim();
  if (!t) return;
  textIn.value = "";
  ask({ text: t });
};
</script>
</body>
</html>
